name: Update V2CROSS subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Fetch V2CROSS snapshot
        run: node fetch-v2cross.mjs
      - name: Commit and push if changed
        run: |
          if git status --porcelain -- sub/v2cross.txt sub/v2cross-base64.txt sub/v2cross-stats.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sub/v2cross.txt sub/v2cross-base64.txt sub/v2cross-stats.json
            git commit -m "chore: update v2cross subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes, nothing to commit."
          fi
