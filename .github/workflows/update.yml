name: Update subscription

on:
  schedule:
    # GitHub 用 UTC。23 */6 * * * = 每 6 小时一次（北京时间 07:23 / 13:23 / 19:23 / 01:23）
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources.txt'
      - 'fetch-nodes.mjs'
      - 'convert.mjs'
      - 'sync-gist.mjs'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 / 清洗 / 去重 / 存活检测
        env:
          TCP_CHECK: '1'
          TCP_CONCURRENCY: '192'
          TCP_TIMEOUT_MS: '3000'
          MIN_NODES: '20' # 低于这个数量认为抓取异常，直接失败并保留上一版
          GIST_ID: ${{ vars.GIST_ID }} # 上游可选 Gist 变量（未设则跳过）
          GH_TOKEN: ${{ secrets.GIST_PAT }}
        run: node fetch-nodes.mjs

      - name: 转换为 Clash / sing-box
        env:
          MIN_NODES: '20' # 可转换节点少于 20 则失败、不提交，保留上一版 clash.yaml / sing-box.json
        run: node convert.mjs

      - name: 写运行摘要
        if: always()
        run: |
          echo "## 本次抓取" >> $GITHUB_STEP_SUMMARY
          echo "- v2ray.txt 行数：$(wc -l < sub/v2ray.txt 2>/dev/null || echo 0)" >> $GITHUB_STEP_SUMMARY
          echo "- Clash proxies：$(grep -c '^  - name:' sub/clash.yaml 2>/dev/null || echo 0)" >> $GITHUB_STEP_SUMMARY
          ls -l sub/ >> $GITHUB_STEP_SUMMARY

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: 同步到 Gist（base64 / Clash / sing-box）
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node sync-gist.mjs
